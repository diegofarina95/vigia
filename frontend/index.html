    <script>
      // Resolve relative asset URLs against the mount prefix, so the same
      // build works at "/", "/vigia" and "/vigia/". Keep the route list in
      // sync with src/prefix.ts.
      (function () {
        var routes = { "": 1, dashboard: 1, "dmarc-checker": 1, privacy: 1, demo: 1 };
        var seg = location.pathname.split("/")[1] || "";
        var prefix = routes[seg] !== undefined ? "" : "/" + seg;
        document.write('<base href="' + prefix + '/">');
      })();
    </script>
    <script>
      // Runs before first paint, so a reader on dark never sees a white flash.
      // Kept inline and duplicated from src/lib/theme.ts on purpose: importing a
      // module here would mean waiting for the bundle, which is the flash.
      (function () {
        try {
          var t = localStorage.getItem("vigia_theme");
          var oscuro =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (oscuro) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
